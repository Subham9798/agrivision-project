<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriVision AI - Plant Disease Detector</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            background: white;
            margin: 30px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1b5e20;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #555;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .upload-section {
            border: 2px dashed #81c784;
            padding: 30px;
            border-radius: 8px;
            background-color: #f9fbf9;
            cursor: pointer;
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #1b5e20;
        }
        .btn:disabled {
            background-color: #a5d6a7;
            cursor: not-allowed;
        }
        #preview {
            max-width: 100%;
            max-height: 250px;
            margin-top: 15px;
            border-radius: 6px;
            display: none;
        }
        #resultCard {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background-color: #e8f5e9;
            border-left: 5px solid #2e7d32;
            text-align: left;
            display: none;
        }
        .result-item {
            margin-bottom: 10px;
            font-size: 16px;
        }
        .loading {
            display: none;
            margin: 15px 0;
            font-weight: bold;
            color: #2e7d32;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌱 AgriVision AI</h1>
    <p class="subtitle">Scan crop leaves to detect diseases instantly</p>

    <div class="upload-section" onclick="document.getElementById('imageInput').click()">
        <p style="margin: 0; color: #666;">Click here to upload leaf image</p>
        <input type="file" id="imageInput" accept="image/*">
        <img id="preview" alt="Image Preview">
    </div>

    <button id="scanBtn" class="btn" onclick="uploadAndPredict()">Scan Plant Canopy</button>
    
    <div id="loadingText" class="loading">⏳ Processing image on cloud server... Please wait...</div>

    <div id="resultCard">
        <h3 style="color: #1b5e20; margin-top: 0;">Diagnostic Report:</h3>
        <div class="result-item"><b>Scan ID:</b> <span id="resId"></span></div>
        <div class="result-item"><b>Detected Crop/Object:</b> <span id="resObject"></span></div>
        <div class="result-item"><b>Diagnosis (English):</b> <span id="resEn"></span></div>
        <div class="result-item"><b>Diagnosis (Hindi):</b> <span id="resHi"></span></div>
        <div class="result-item"><b>Epidemic Risk Factor:</b> <span id="resRisk"></span></div>
        <hr style="border: 0; border-top: 1px solid #c5e1a5; margin: 15px 0;">
        <div class="result-item" style="color: #c62828;"><b>Cure (English):</b> <span id="resCureEn"></span></div>
        <div class="result-item" style="color: #c62828; margin-top: 5px;"><b>Cure (Hindi):</b> <span id="resCureHi"></span></div>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const scanBtn = document.getElementById('scanBtn');
    const loadingText = document.getElementById('loadingText');
    const resultCard = document.getElementById('resultCard');

    // Show image preview when selected
    imageInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(file);
            resultCard.style.display = 'none'; // Hide previous results
        }
    });

    // Send image to live Render backend
    async function uploadAndPredict() {
        const file = imageInput.files[0];
        if (!file) {
            alert("Please upload an image first!");
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        // UI Updates (Disable button and show loading)
        scanBtn.disabled = true;
        loadingText.style.display = "block";
        resultCard.style.display = "none";

        try {
            // BACKEND URL CONNECTED HERE SUCCESSFULLY
            const response = await fetch("https://agrivision-project-icmn.onrender.com/predict", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (data.status === "Success") {
                // Populate data into HTML elements
                document.getElementById('resId').innerText = data.scan_id;
                document.getElementById('resObject').innerText = data.detected_object;
                document.getElementById('resEn').innerText = data.condition_en;
                document.getElementById('resHi').innerText = data.condition_hi;
                document.getElementById('resRisk').innerText = data.epidemic_factor;
                document.getElementById('resCureEn').innerText = data.cure_en;
                document.getElementById('resCureHi').innerText = data.cure_hi;

                // Show the results card
                resultCard.style.display = "block";
            } else {
                alert("Error from server: " + data.message);
            }
        } catch (error) {
            console.error("Error:", error);
            alert("Failed to connect to the cloud server. Make sure your Render backend is active.");
        } finally {
            // Reset UI states
            scanBtn.disabled = false;
            loadingText.style.display = "none";
        }
    }
</script>

</body>
</html>
